name: only-develop-to-main

on:
  pull_request:
    branches: ["main"]

jobs:
  only-develop-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only develop -> main PRs
        run: |
          if [ "$GITHUB_HEAD_REF" != "develop" ]; then
            echo "Only PRs from 'develop' to 'main' are allowed."
            exit 1
          fi

  quality:
    needs: only-develop-to-main
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub.dev dry-run
        run: dart pub publish --dry-run
