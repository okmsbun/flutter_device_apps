name: flutter_device_apps
description: >-
  Flutter plugin to list installed Android apps, get app icons,
  check installation status, launch apps, and detect packaged frameworks.
version: 1.1.0
repository: https://github.com/okmsbun/flutter_device_apps
issue_tracker: https://github.com/okmsbun/flutter_device_apps/issues
topics:
  - installed-apps
  - app-management
  - package-manager

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_device_apps_android: ^1.1.0
  flutter_device_apps_platform_interface: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_device_apps_android
