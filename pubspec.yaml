name: flutter_device_apps
description: A single Flutter entry point for app discovery and management on Android and macOS.
version: 2.0.0
repository: https://github.com/okmsbun/flutter_device_apps
issue_tracker: https://github.com/okmsbun/flutter_device_apps/issues
topics:
  - installed-apps
  - app-management
  - package-manager

platforms:
  android:
  macos:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_device_apps_android: ^2.0.0
  flutter_device_apps_macos: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
