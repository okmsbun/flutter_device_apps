name: flutter_device_apps
description: List installed apps in Flutter on Android, macOS, and Linux. Get app icons and metadata, launch apps, and detect app technologies.
version: 2.1.0
repository: https://github.com/okmsbun/flutter_device_apps
issue_tracker: https://github.com/okmsbun/flutter_device_apps/issues
topics:
  - installed-apps
  - app-management
  - package-manager

platforms:
  android:
  macos:
  linux:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_device_apps_android: ^2.2.0
  flutter_device_apps_linux: ^1.0.0
  flutter_device_apps_macos: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
